name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # --manifest dpi_unaware.manifest: 不做 DPI 感知, 150% 缩放下窗口按系统缩放拉伸
          # (与本地 spec 一致; 缺失会让 Tk 按物理像素布局, 窗口缩成 2/3, 文字被裁)
          pyinstaller --onefile --windowed --name "DeepSeek_API_Balance" --icon "icon.ico" --manifest "dpi_unaware.manifest" --add-data ".deepseek_whale.png;." --collect-all certifi DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance.exe" "dist/DeepSeek_API_Balance-Windows.exe"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --name "DeepSeek_API_Balance" --icon "icon.icns" --add-data ".deepseek_whale.png:." DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance" "dist/DeepSeek_API_Balance-macOS"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "DeepSeek_API_Balance" --add-data ".deepseek_whale.png:." DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance" "dist/DeepSeek_API_Balance-Linux"
          # Linux 无内嵌图标机制, 生成图标包(.desktop + PNG + 安装说明)
          python -c "from PIL import Image; Image.open('icon.ico').save('dist/icon-256.png', 'PNG')"
          cp "DeepSeek_API_Balance.desktop" "INSTALL_LINUX.md" dist/
          tar -czf "dist/DeepSeek_API_Balance-Linux-icons.tar.gz" -C dist icon-256.png DeepSeek_API_Balance.desktop INSTALL_LINUX.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek_API_Balance-*
