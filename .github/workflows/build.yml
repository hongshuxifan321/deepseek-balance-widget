name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "DeepSeek_API_Balance" --add-data ".deepseek_whale.png;." --collect-all certifi DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance.exe" "dist/DeepSeek_API_Balance-Windows.exe"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --name "DeepSeek_API_Balance" --add-data ".deepseek_whale.png:." DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance" "dist/DeepSeek_API_Balance-macOS"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "DeepSeek_API_Balance" --add-data ".deepseek_whale.png:." DeepSeek_API余额.py
          cp "dist/DeepSeek_API_Balance" "dist/DeepSeek_API_Balance-Linux"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek_API_Balance-*
